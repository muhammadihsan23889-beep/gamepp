  <style>
    :root{
      --navy:#020b2b;
      --blue:#082b75;
      --deep:#01051b;
      --gold:#f8c84a;
      --gold-light:#fff0a4;
      --red:#de2436;
      --ink:#eef4ff;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-width:320px; overflow-x:hidden;
      font-family:"Copperplate Gothic","Times New Roman",serif;
      color:var(--ink); background:#01051b;
    }
    #app{
      width:100%; min-height:calc(100 * min(var(--vh, 1vh), 1vh));
      position:relative; overflow:hidden;
      background:
        radial-gradient(circle at 50% 12%, rgba(51,126,255,.24), transparent 28%),
        radial-gradient(circle at 10% 90%, rgba(248,200,74,.13), transparent 24%),
        radial-gradient(circle at 90% 80%, rgba(248,200,74,.1), transparent 26%),
        linear-gradient(145deg,#01051b 0%,#031447 50%,#010619 100%);
    }
    #app:before,#app:after{
      content:""; position:absolute; pointer-events:none; inset:auto;
      width:68vw; height:120vh; top:-28vh; opacity:.23; filter:blur(4px);
      background:conic-gradient(from 28deg at 50% 0%, transparent 0 12%, #5c9dff 13% 14%, transparent 15% 26%,#f8c84a 27% 28%,transparent 29% 100%);
      transform:rotate(-18deg);
    }
    #app:after{right:-33vw; transform:rotate(18deg); opacity:.17}
    .screen{
      width:100%; min-height:calc(100 * min(var(--vh, 1vh), 1vh));
      position:relative; z-index:1; display:none; padding:24px;
      animation:screenIn .65s ease both;
    }
    .screen.active{display:flex}
    @keyframes screenIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
    .logo-ring{
      width:132px;height:132px;border-radius:50%;padding:10px;
      background:linear-gradient(135deg,#fff5b5,#b97905 45%,#fff4aa);
      box-shadow:0 0 22px #f8c84a,0 0 65px rgba(248,200,74,.45);
      animation:float 3.4s ease-in-out infinite;
    }
    .logo-ring img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:4px solid #061349}
    @keyframes float{50%{transform:translateY(-9px) rotate(2deg)}}
    .title-glow{text-shadow:0 0 10px #fff0a4,0 0 28px #f8c84a,0 0 60px #bb7600;letter-spacing:.08em}
    .gold-line{height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 13px var(--gold)}
    .metal-panel{
      background:linear-gradient(135deg,rgba(5,23,76,.91),rgba(2,8,38,.96));
      border:1px solid rgba(248,200,74,.72);
      box-shadow:inset 0 0 25px rgba(33,93,214,.38),0 0 22px rgba(248,200,74,.2);
    }
    .btn-gold,.choice{
      border:1px solid #ffd966; color:#fff7ca;
      background:linear-gradient(100deg,#5a3500,#d68b08 50%,#543100);
      box-shadow:inset 0 0 12px rgba(255,245,173,.42),0 0 13px rgba(248,200,74,.3);
      transition:transform .2s,filter .2s,box-shadow .2s;
    }
    .btn-gold:hover,.choice:hover{transform:translateY(-2px);filter:brightness(1.16);box-shadow:inset 0 0 14px #fff3a5,0 0 25px rgba(248,200,74,.7)}
    .pulse{animation:pulse 1.8s ease-in-out infinite}
    @keyframes pulse{50%{box-shadow:inset 0 0 14px #fff8bf,0 0 34px #f8c84a;transform:scale(1.025)}}
    input{
      font-family:inherit; outline:none; color:#fff6c7;
      background:rgba(1,8,39,.8); border:1px solid rgba(248,200,74,.76);
      box-shadow:inset 0 0 16px rgba(13,64,163,.5);
    }
    input:focus{box-shadow:0 0 0 3px rgba(248,200,74,.23),inset 0 0 16px rgba(13,64,163,.5)}
    .lifeline{
      border:1px solid rgba(248,200,74,.6); background:rgba(4,21,70,.74);
      box-shadow:inset 0 0 15px rgba(33,105,235,.25);
      transition:.25s;
    }
    .lifeline:hover:not(:disabled){transform:translateY(-4px);border-color:#fff0a4;box-shadow:0 0 22px rgba(248,200,74,.48)}
    .lifeline:disabled{opacity:.32;filter:grayscale(1);cursor:not-allowed}
    .timer{
      width:112px;height:112px;border-radius:50%;
      background:conic-gradient(var(--gold) calc(var(--progress)*1%),rgba(255,255,255,.12) 0);
      display:grid;place-items:center;box-shadow:0 0 24px rgba(248,200,74,.45);transition:.35s;
    }
    .timer:before{content:"";position:absolute;width:92px;height:92px;border-radius:50%;background:#061143}
    .timer span{position:relative;font-size:25px;font-weight:bold}
    .timer.danger{background:conic-gradient(var(--red) calc(var(--progress)*1%),rgba(255,255,255,.12) 0);box-shadow:0 0 25px rgba(222,36,54,.85);animation:dangerPulse .75s infinite}
    @keyframes dangerPulse{50%{transform:scale(1.06)}}
    .question-box{position:relative;border:2px solid var(--gold);clip-path:polygon(4% 0,96% 0,100% 18%,100% 82%,96% 100%,4% 100%,0 82%,0 18%);background:linear-gradient(120deg,#051348,#143d95,#051348);box-shadow:inset 0 0 25px rgba(248,200,74,.2),0 0 22px rgba(248,200,74,.42)}
    .choice{min-height:57px;text-align:left;border-radius:999px;background:linear-gradient(90deg,#0a236b,#133b96 48%,#0a236b);display:flex;align-items:center;gap:12px;padding:10px 17px}
    .choice-letter{display:grid;place-items:center;width:31px;height:31px;border-radius:50%;border:1px solid #ffd966;color:#ffd966;font-weight:bold;flex:none}
    .choice.selected{border-color:#fff6ab;background:linear-gradient(90deg,#8c5d05,#e6ab21,#8c5d05);box-shadow:0 0 20px #f8c84a}
    .choice.correct{background:linear-gradient(90deg,#0b672f,#16a34a,#0b672f);border-color:#b6ffb8}
    .choice.wrong{background:linear-gradient(90deg,#861b2c,#dc293e,#861b2c);border-color:#ffacb4}
    .choice.removed{visibility:hidden;pointer-events:none}
    .level-row{border-left:2px solid transparent;padding:5px 10px;display:flex;justify-content:space-between;font-size:12px;color:#b8c5ee;transition:.25s}
    .level-row.active{color:#fff4ac;background:linear-gradient(90deg,rgba(248,200,74,.28),transparent);border-left-color:#f8c84a;box-shadow:inset 0 0 11px rgba(248,200,74,.18)}
    .level-row.done{color:#f8c84a}
    .modal{display:none;position:fixed;z-index:20;inset:0;padding:20px;background:rgba(0,3,21,.74);place-items:center;backdrop-filter:blur(7px)}
    .modal.show{display:grid}
    .modal-card{max-width:570px;width:100%;animation:modalIn .35s ease both}
    @keyframes modalIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
    .audience-bar{height:13px;background:#071339;border:1px solid rgba(255,255,255,.16);overflow:hidden}
    .audience-fill{height:100%;width:0;background:linear-gradient(90deg,#b97905,#fff1a7);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
    .shake{animation:shake .45s linear 2}
    @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
    .flash-red{animation:flashRed .45s linear 3}
    @keyframes flashRed{50%{box-shadow:0 0 60px 18px #ff263b;background:rgba(170,0,18,.7)}}
    #confetti{position:fixed;z-index:30;inset:0;pointer-events:none;overflow:hidden}
    .confetti{position:absolute;width:10px;height:15px;top:-30px;animation:fall linear forwards}
    @keyframes fall{to{transform:translate(var(--drift),calc(100 * min(var(--vh, 1vh), 1vh))) rotate(900deg)}}
    @media(max-width:900px){
      .game-grid{grid-template-columns:1fr!important}
      .levels-panel{order:-1;max-height:206px;overflow:auto}
      .screen{padding:14px}
      .question-box{clip-path:none;border-radius:19px}
      .logo-ring{width:102px;height:102px}
    }
  </style>

     <div class="text-center mt-7">
      <button class="modal-close btn-gold rounded-lg px-7 py-3 font-bold" type="button" data-close="audience-modal"><span data-template-id="audience-close-label" class="canva-text"></span></button>

  <script src="/_sdk/336a49df5a82c939.editing_sdk.js" integrity="sha512-kW4iY7c9SZ3trXkzoTE65xax0DcYSa51ZKy2HG+dKjAzdAHckXWjbAVamldsupSSaGH2q0he8oo/VdmembI7Hw=="></script>
  <script>
    const questions = [
      {q:"BPUPK dibentuk untuk mempersiapkan kemerdekaan Indonesia pada tanggal ...",a:["29 April 1945","28 Mei 1945","29 Mei 1945","10 Juli 1945","7 Agustus 1945"],c:0},
      {q:"Siapakah tokoh yang menyampaikan gagasan dasar negara pada 29 Mei 1945?",a:["Soepomo","Mohammad Yamin","Soekarno","Mohammad Hatta","Radjiman Wedyodiningrat"],c:1},
      {q:"Pada 31 Mei 1945, gagasan tentang dasar negara disampaikan oleh ...",a:["Soekarno","Mohammad Yamin","Soepomo","Ahmad Soebardjo","Ki Hajar Dewantara"],c:2},
      {q:"Istilah Pancasila diperkenalkan Soekarno dalam pidatonya pada ...",a:["29 Mei 1945","31 Mei 1945","1 Juni 1945","22 Juni 1945","17 Agustus 1945"],c:2},
      {q:"Panitia Sembilan menyepakati Piagam Jakarta pada tanggal ...",a:["1 Juni 1945","22 Juni 1945","10 Juli 1945","14 Juli 1945","17 Juli 1945"],c:1},
      {q:"Sidang kedua BPUPK dimulai pada tanggal ...",a:["22 Juni 1945","1 Juli 1945","10 Juli 1945","14 Juli 1945","17 Juli 1945"],c:2},
      {q:"Pada 14 Juli 1945, pembahasan yang dilanjutkan adalah rancangan ...",a:["Teks Proklamasi","Pembukaan Undang-Undang Dasar","Piagam Jakarta","Kabinet Indonesia","Pembagian wilayah"],c:1},
      {q:"BPUPK dibubarkan dan persiapan kemerdekaan dilanjutkan pada ...",a:["17 Juli 1945","7 Agustus 1945","9 Agustus 1945","15 Agustus 1945","16 Agustus 1945"],c:1},
      {q:"Organisasi yang dibentuk untuk melanjutkan persiapan kemerdekaan adalah ...",a:["BPUPK","KNIP","PPKI","Panitia Sembilan","BKR"],c:2},
      {q:"Jepang menyerah kepada Sekutu pada tanggal ...",a:["7 Agustus 1945","9 Agustus 1945","15 Agustus 1945","16 Agustus 1945","17 Agustus 1945"],c:2},
      {q:"Peristiwa Rengasdengklok terjadi pada tanggal ...",a:["15 Agustus 1945","16 Agustus 1945","17 Agustus 1945","18 Agustus 1945","19 Agustus 1945"],c:1},
      {q:"Proklamasi Kemerdekaan Indonesia dibacakan pada tanggal ...",a:["16 Agustus 1945","17 Agustus 1945","18 Agustus 1945","19 Agustus 1945","1 Juni 1945"],c:1},
      {q:"PPKI mengesahkan UUD 1945 dan rumusan final Pancasila pada ...",a:["17 Agustus 1945","18 Agustus 1945","19 Agustus 1945","22 Juni 1945","1 Juni 1945"],c:1},
      {q:"Pada 18 Agustus 1945, Soekarno dan Mohammad Hatta ditetapkan sebagai ...",a:["Ketua dan Wakil Ketua BPUPK","Presiden dan Wakil Presiden","Menteri dan Perdana Menteri","Ketua dan Wakil Ketua PPKI","Panglima dan Wakil Panglima"],c:1},
      {q:"Keputusan Presiden Nomor 24 Tahun 2016 menetapkan 1 Juni sebagai ...",a:["Hari Kemerdekaan","Hari Konstitusi","Hari Lahir Pancasila","Hari Pahlawan","Hari Pendidikan Nasional"],c:2}
    ];
    const prizes=["Rp100.000","Rp200.000","Rp300.000","Rp500.000","Rp1.000.000","Rp2.000.000","Rp4.000.000","Rp8.000.000","Rp16.000.000","Rp32.000.000","Rp64.000.000","Rp125.000.000","Rp250.000.000","Rp500.000.000","Rp1.000.000.000"];
    const letters=["A","B","C","D","E"];
    let playerName="",current=0,selected=null,timerId=null,timeLeft=60,locked=false;
    let lifelines={fifty:false,phone:false,audience:false};
    let audioCtx=null,ambientId=null;

    function initGame(){
      document.getElementById("name-form").addEventListener("submit",startGame);
      document.getElementById("play-button").addEventListener("click",()=>{playSound("click");loadQuestion();showScreen("game-screen")});
      document.getElementById("final-button").addEventListener("click",lockAnswer);
      document.getElementById("life-5050").addEventListener("click",apply5050);
      document.getElementById("life-phone").addEventListener("click",phoneFriend);
      document.getElementById("life-audience").addEventListener("click",askAudience);
      document.getElementById("restart-win").addEventListener("click",resetGame);
      document.getElementById("restart-lose").addEventListener("click",resetGame);
      document.querySelectorAll(".modal-close").forEach(btn=>btn.addEventListener("click",()=>document.getElementById(btn.dataset.close).classList.remove("show")));
      buildLevels();
      lucide.createIcons();
    }
    function showScreen(id){
      document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }
    function startGame(event){
      event.preventDefault();
      const field=document.getElementById("player-name");
      playerName=field.value.trim() || "Peserta";
      ensureAudio(); playSound("click"); showInstructions();
    }
    function showInstructions(){showScreen("instructions-screen");playSound("ambient")}
    function buildLevels(){
      const list=document.getElementById("levels-list"); list.innerHTML="";
      for(let i=14;i>=0;i--){
        const row=document.createElement("div"); row.className="level-row"; row.id="level-"+i;
        row.innerHTML="<span>"+(i+1).toString().padStart(2,"0")+"</span><strong>"+prizes[i]+"</strong>";
        list.appendChild(row);
      }
    }
    function loadQuestion(){
      stopTimer(); selected=null; locked=false;
      document.getElementById("player-display").textContent=playerName;
      document.getElementById("question-number").textContent="PERTANYAAN "+(current+1)+" DARI 15";
      document.getElementById("question-text").textContent=questions[current].q;
      document.getElementById("current-prize").textContent=prizes[current];
      const answerBox=document.getElementById("answers");answerBox.innerHTML="";
      questions[current].a.forEach((answer,index)=>{
        const btn=document.createElement("button");btn.type="button";btn.className="choice";btn.dataset.index=index;
        btn.innerHTML='<span class="choice-letter">'+letters[index]+'</span><span>'+answer+'</span>';
        btn.addEventListener("click",()=>selectAnswer(index));answerBox.appendChild(btn);
      });
      document.getElementById("final-button").disabled=true;
      document.querySelectorAll(".level-row").forEach((row,i)=>{
        const n=Number(row.id.replace("level-",""));
        row.classList.toggle("active",n===current);row.classList.toggle("done",n<current);
      });
      ["life-5050","life-phone","life-audience"].forEach((id,i)=>document.getElementById(id).disabled=Object.values(lifelines)[i]);
      document.getElementById("question-panel").style.animation="none";
      requestAnimationFrame(()=>document.getElementById("question-panel").style.animation="screenIn .45s ease both");
      startTimer();
    }
    function selectAnswer(index){
      if(locked)return;
      selected=index;playSound("click");
      document.querySelectorAll(".choice").forEach(btn=>btn.classList.toggle("selected",Number(btn.dataset.index)===index));
      document.getElementById("final-button").disabled=false;
    }
    function lockAnswer(){
      if(selected===null||locked)return;
      locked=true;stopTimer();playSound("suspense");
      document.getElementById("final-button").disabled=true;
      document.querySelectorAll(".choice").forEach(btn=>btn.disabled=true);
      document.getElementById("question-panel").classList.add("pulse");
      setTimeout(checkAnswer,3000);
    }
    function checkAnswer(){
      document.getElementById("question-panel").classList.remove("pulse");
      const correct=questions[current].c;
      const options=document.querySelectorAll(".choice");
      options[correct].classList.add("correct");
      if(selected===correct){
        playSound("win");
        burstConfetti(35);
        setTimeout(nextQuestion,1550);
      }else{
        options[selected].classList.add("wrong");
        playSound("buzzer");
        document.getElementById("question-panel").classList.add("shake","flash-red");
        setTimeout(showLoseScreen,1550);
      }
    }
    function nextQuestion(){
      current++;
      if(current>=questions.length)showWinScreen(); else loadQuestion();
    }
    function startTimer(){
      timeLeft=60;updateTimer();
      timerId=setInterval(()=>{
        timeLeft--;updateTimer();
        if(timeLeft<=10&&timeLeft>0)playSound("tick");
        if(timeLeft<=0){stopTimer();playSound("buzzer");setTimeout(showLoseScreen,300)}
      },1000);
    }
    function updateTimer(){
      const timer=document.getElementById("timer");
      document.getElementById("timer-value").textContent=timeLeft;
      timer.style.setProperty("--progress",(timeLeft/60)*100);
      timer.classList.toggle("danger",timeLeft<=10);
    }
    function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
    function apply5050(){
      if(lifelines.fifty||locked)return;
      lifelines.fifty=true;document.getElementById("life-5050").disabled=true;playSound("click");
      const wrong=questions[current].a.map((_,i)=>i).filter(i=>i!==questions[current].c).sort(()=>Math.random()-.5).slice(0,2);
      wrong.forEach(i=>document.querySelector('.choice[data-index="'+i+'"]').classList.add("removed"));
    }
    function phoneFriend(){
      if(lifelines.phone||locked)return;
      lifelines.phone=true;document.getElementById("life-phone").disabled=true;playSound("click");
      const correct=questions[current].c;
      document.getElementById("phone-advice").textContent="“Saya cukup yakin jawabannya adalah pilihan "+letters[correct]+": "+questions[current].a[correct]+".”";
      document.getElementById("phone-modal").classList.add("show");
    }
    function askAudience(){
      if(lifelines.audience||locked)return;
      lifelines.audience=true;document.getElementById("life-audience").disabled=true;playSound("click");
      const correct=questions[current].c;
      let values=[8,12,10,7,9];values[correct]=54+Math.floor(Math.random()*18);
      const remaining=100-values[correct], others=values.map((_,i)=>i).filter(i=>i!==correct);
      let used=0;others.forEach((i,n)=>{values[i]=n===others.length-1?remaining-used:Math.floor(remaining/(others.length)+Math.random()*4);used+=values[i]});
      const results=document.getElementById("audience-results");results.innerHTML="";
      values.forEach((value,index)=>{
        const row=document.createElement("div");
        row.innerHTML='<div class="flex justify-between text-sm mb-1"><span>'+letters[index]+'. '+questions[current].a[index]+'</span><strong>'+value+'%</strong></div><div class="audience-bar rounded-full"><div class="audience-fill" data-width="'+value+'"></div></div>';
        results.appendChild(row);
      });
      document.getElementById("audience-modal").classList.add("show");
      requestAnimationFrame(()=>document.querySelectorAll(".audience-fill").forEach(bar=>bar.style.width=bar.dataset.width+"%"));
    }
    function showWinScreen(){
      stopTimer();stopSound("ambient");playSound("victory");burstConfetti(150);
      document.getElementById("win-player").textContent=playerName;
      document.getElementById("win-prize").textContent=prizes[14];
      showScreen("win-screen");
    }
    function showLoseScreen(){
      stopTimer();stopSound("ambient");
      const earned=current>0?prizes[current-1]:"Rp0";
      document.getElementById("lose-player").textContent=playerName;
      document.getElementById("lose-prize").textContent=earned;
      showScreen("lose-screen");
    }
    function resetGame(){
      stopTimer();current=0;selected=null;locked=false;lifelines={fifty:false,phone:false,audience:false};
      document.getElementById("player-name").value=playerName;
      showScreen("opening-screen");playSound("ambient");
    }
    function ensureAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}
    function tone(freq,duration,type="sine",volume=.08,delay=0){
      if(!audioCtx)return;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
      osc.type=type;osc.frequency.setValueAtTime(freq,audioCtx.currentTime+delay);
      gain.gain.setValueAtTime(.0001,audioCtx.currentTime+delay);gain.gain.exponentialRampToValueAtTime(volume,audioCtx.currentTime+delay+.02);
      gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+delay+duration);
      osc.connect(gain).connect(audioCtx.destination);osc.start(audioCtx.currentTime+delay);osc.stop(audioCtx.currentTime+delay+duration+.03);
    }
    function playSound(type){
      ensureAudio();
      if(type==="click"){tone(640,.07,"triangle",.09);tone(920,.1,"sine",.05,.06)}
      if(type==="tick")tone(930,.055,"square",.035);
      if(type==="suspense"){[160,180,210,240,285].forEach((f,i)=>tone(f,.28,"sawtooth",.045,i*.53))}
      if(type==="win"){[523,659,784,1046].forEach((f,i)=>tone(f,.38,"triangle",.1,i*.12))}
      if(type==="victory"){[392,523,659,784,1046].forEach((f,i)=>tone(f,.55,"triangle",.12,i*.13))}
      if(type==="buzzer"){tone(160,.55,"sawtooth",.15);tone(120,.65,"square",.08,.08)}
      if(type==="ambient"&&!ambientId){
        const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type="sine";osc.frequency.value=65;gain.gain.value=.018;
        osc.connect(gain).connect(audioCtx.destination);osc.start();ambientId={osc,gain};
      }
    }
    function stopSound(type){if(type==="ambient"&&ambientId){ambientId.gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.2);ambientId.osc.stop(audioCtx.currentTime+.25);ambientId=null}}
    function burstConfetti(amount){
      const host=document.getElementById("confetti"),colors=["#f8c84a","#fff0a4","#1677ff","#e52d3d","#ffffff"];
      for(let i=0;i<amount;i++){const piece=document.createElement("i");piece.className="confetti";piece.style.left=Math.random()*100+"%";piece.style.background=colors[i%colors.length];piece.style.setProperty("--drift",(Math.random()*240-120)+"px");piece.style.animationDuration=(2+Math.random()*2.2)+"s";host.appendChild(piece);setTimeout(()=>piece.remove(),4500)}
    }
    document.addEventListener("DOMContentLoaded",initGame);
  </script>
