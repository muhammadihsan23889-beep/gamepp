lencana:["🗝️ Penjaga Arsip","✏️ Penyunting Berita","🧩 Perakit Saksi","🖼️ Perakit Bukti","👑 Detektif Demokrasi"],

cerita:[
{j:"Ruang Arsip Rahasia",t:"Malam turun di Santunlandia. Pesan berantai menuduh para pengkritik Proyek Pasar Megah sebagai pengkhianat kota. Di balik kekacauan ini tercium nama pejabat paling berkuasa: Wali Kota Gandara Kuasa. Di Ruang Arsip Rahasia tersimpan memo lama. Pahami aturan demokrasi dulu, Detektif, agar kunci pertama terbuka."},
{j:"Redaksi Berita Palsu",t:"Memo itu menyebut “Naskah Berita Pesanan”. Redaksi berita palsu masih menyimpan draf yang bolong-bolong. Lengkapi naskahnya dengan kata yang benar untuk membongkar siapa pemesannya."},
{j:"Kantor Saksi",t:"Para saksi takut bicara. Mereka hanya meninggalkan pernyataan yang terpotong dan acak. Rakit kembali kalimat mereka agar kesaksiannya bermakna."},
{j:"Lab Foto Bukti",t:"Di Balai Kota ditemukan tiga foto kegiatan warga yang disobek menjadi kepingan. Memo sang wali kota menyebut mereka “pengkhianat”. Susun kepingan foto itu seperti bermain puzzle, lalu buktikan apakah warga memang bersalah."},
{j:"Pengadilan Santunlandia",t:"Empat kunci terkumpul dan Pintu Pengadilan terbuka. Wali Kota Gandara Kuasa duduk di kursi terdakwa. Rangkai papan bukti, tentukan dalang utamanya, uji dilema etika, lalu bantah pembelaannya."}],
kunci:[
{i:"🗝️",n:"Kunci Arsip",c:"Sebuah memo bertanda tangan “G.K.” berbunyi: pengkritik proyek harus dicap pengkhianat."},
{i:"🗝️",n:"Kunci Redaksi",c:"Naskah hoaks ternyata diketik dari komputer di Balai Kota."},
{i:"🗝️",n:"Kunci Saksi",c:"Rekaman suara: “Kerjakan saja, jangan sebut namaku.”"},
{i:"🗝️",n:"Kunci Foto Bukti",c:"Foto-foto yang dipulihkan membuktikan warga menyuarakan pendapat secara damai, sehingga cap “pengkhianat” dari Balai Kota adalah fitnah."},
{i:"🔨",n:"Palu Keadilan",c:"Semua bukti terhubung. Saatnya hakim memutuskan."}],

{i:"🤝",t:"Perilaku Demokratis",b:"Menghargai perbedaan pendapat, bermusyawarah, bertanggung jawab, dan taat aturan. Demokrasi bukan sekadar menang suara."},
{i:"📊",t:"Demokrasi Indonesia (EIU)",b:"Skor <b>6,37</b> dari 10 (tahun 2025), peringkat <b>60 dari 167</b> negara, kategori <b>demokrasi cacat (flawed democracy)</b>. Tren menurun: 6,71 (2022) → 6,53 (2023) → 6,44 (2024) → 6,37 (2025). Lima indikator: proses pemilu & pluralisme, fungsi pemerintahan, partisipasi politik, budaya politik, kebebasan sipil.<br><small>Sumber: EIU Democracy Index 2025 (dikutip Katadata, 2026).</small>"},
{i:"⚖️",t:"Pasal 28E, 28F, 28J",b:"28E: bebas berserikat, berkumpul, dan berpendapat. 28F: berhak berkomunikasi dan memperoleh informasi. 28J: kebebasan dibatasi demi hak orang lain, moral, nilai agama, keamanan, dan ketertiban umum."},
{i:"🔎",t:"Hoaks, Jejak Digital & Etika Medsos",b:"Hoaks = informasi palsu yang menyesatkan. Ujaran kebencian menyerang kelompok. Jejak digital sulit dihapus. Etika bermedsos: santun, bertanggung jawab, kritis pada sumber. Prinsip: cek sebelum sebar (saring sebelum sharing)."},
{i:"🏛️",t:"10 Pilar Demokrasi (Ahmad Sanusi)",b:"<ol style='text-align:left;font-size:.88rem;margin:4px 0;padding-left:22px'><li>Berketuhanan Yang Maha Esa</li><li>Dengan kecerdasan</li><li>Berkedaulatan rakyat</li><li>Dengan <i>rule of law</i></li><li>Dengan pembagian kekuasaan negara</li><li>Dengan hak asasi manusia</li><li>Dengan pengadilan yang merdeka</li><li>Dengan otonomi daerah</li><li>Dengan kemakmuran</li><li>Berkeadilan sosial</li></ol><small>Sumber: Sanusi (2006), Memberdayakan Masyarakat dalam Pelaksanaan 10 Pilar Demokrasi.</small>"}],
// 5 studi kasus Babak 1: q=soal, o=pilihan, a=indeks benar, h=2 petunjuk, e=penjelasan
b1:[
{q:"Rina menerima broadcast “Air PDAM beracun, sebarkan sekarang!” tanpa sumber. Teman-temannya mendesak ia segera meneruskan. Tindakan yang paling bertanggung jawab?",o:["Meneruskan agar semua waspada","Mengecek ke akun resmi PDAM dan media kredibel dulu, baru memutuskan","Menghapus chat lalu memarahi temannya","Membalas dengan menyindir temannya"],a:1,h:["Perhatikan: ada sumber atau tidak?","Prinsipnya ‘saring sebelum sharing’."],e:"Verifikasi dulu ke sumber resmi adalah wujud tanggung jawab dan literasi digital."},
{q:"Usul Dimas ditolak dalam rapat OSIS. Mana yang menunjukkan perilaku TIDAK demokratis?",o:["Dimas menyampaikan keberatan dengan santun","Dimas menolak menjalankan keputusan hasil musyawarah dan memboikot","Ketua membuka sesi tanggapan","Anggota mendengarkan alasan Dimas"],a:1,h:["Cari yang tidak menaati kesepakatan bersama.","Musyawarah menuntut ketaatan pada hasilnya."],e:"Demokrasi menghargai perbedaan, tetapi hasil musyawarah wajib ditaati bersama."},
{q:"Budi mengunggah kritik atas kebijakan sekolah, lengkap dengan data dan bahasa santun. Seorang teman berkata itu melanggar hukum. Penilaian tepat?",o:["Sesuai Pasal 28E karena berpendapat adalah hak, selama tetap menghormati hak orang lain","Melanggar karena siswa dilarang mengkritik","Melanggar karena kritik selalu menyakiti","Boleh asal menyebut nama guru dengan hinaan"],a:0,h:["Pikirkan hak yang dijamin Pasal 28E.","Batasnya ada di Pasal 28J."],e:"Kritik berdata dan santun dilindungi 28E dan tidak melanggar batas 28J."},

const acak=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* Efek suara sederhana (Web Audio) */
function AC(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume()}catch(e){}return ac}
/* Musik latar detektif ala noir (dibangkitkan lewat Web Audio, tanpa berkas audio; jalan offline) */
let musikOn=true,mT=0,mI=0,mTm=null,mg=null;
const BAS={0:110,2:130.81,4:164.81,6:130.81,8:146.83,10:174.61,12:220,14:174.61,16:164.81,18:207.65,20:246.94,22:207.65,24:110,26:130.81,28:164.81,30:123.47};
const MEL={0:[440,.6],3:[523.25,.3],4:[659.25,.9],8:[587.33,.6],11:[698.46,.3],12:[587.33,.5],14:[523.25,.5],16:[493.88,.4],18:[415.3,.4],20:[493.88,.5],22:[659.25,.7],24:[440,1.8]};
function nm(f,t,d,tp,v){let o=ac.createOscillator(),g=ac.createGain();o.type=tp;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05)}
function jadwal(){if(!ac)return;while(mT<ac.currentTime+.8){let s=mI%32,t=mT+(s%2?.05:0);if(BAS[s])nm(BAS[s],t,.45,'triangle',.55);if(MEL[s]){nm(MEL[s][0],t,MEL[s][1],'sine',.4);nm(MEL[s][0]*2,t,MEL[s][1]*.6,'triangle',.07)}mT+=.3;mI++}}
function musikMulai(){if(!musikOn||mTm||!AC())return;if(!mg){mg=ac.createGain();mg.gain.value=.3;mg.connect(ac.destination)}mT=ac.currentTime+.1;mTm=setInterval(jadwal,250);jadwal()}
function musikBerhenti(){clearInterval(mTm);mTm=null}
function togMusik(){musikOn=!musikOn;musikOn?musikMulai():musikBerhenti();let b=$('#mn');if(b)b.textContent=musikOn?'🎵':'🔕'}
function bunyi(f,d=.15,t='sine'){if(!suara)return;try{AC();let o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
const sfx={ok(){bunyi(660);setTimeout(()=>bunyi(880),90)},no(){bunyi(180,.3,'sawtooth')},obj(){bunyi(300,.1,'square');setTimeout(()=>bunyi(620,.35,'square'),110)},win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>bunyi(f,.2),i*130))}};
function togSuara(){suara=!suara;let b=$('#sn');if(b)b.textContent=suara?'🔊':'🔇'}

function say(t){let b=$('#bub');if(b)b.innerHTML=t}

const hud=()=>`<div class="hud"><button class="ib" onclick="peta()">🗺️</button><span>🕵️ ${esc(S.nama)}</span><span id="hr">${'❤️'.repeat(Math.max(0,5-R.m))}</span><span id="sk">⭐${S.skor}</span><button class="ib" id="mn" onclick="togMusik()">${musikOn?'🎵':'🔕'}</button><button class="ib" id="sn" onclick="togSuara()">${suara?'🔊':'🔇'}</button></div>`;
function upHud(){let a=$('#sk'),b=$('#hr');if(a)a.textContent='⭐'+S.skor;if(b)b.textContent='❤️'.repeat(Math.max(0,5-R.m))}
function tambah(p){S.skor=Math.max(0,S.skor+p);if(p>0)S.xp+=p;upHud();simpan()}
function salah(){R.m++;upHud();sfx.no();let s=$('.scr');if(s){s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake')}}

/* Konfeti ringan */
function konfeti(){let c=document.createElement('canvas');c.className='cf';document.body.appendChild(c);c.width=innerWidth;c.height=innerHeight;let x=c.getContext('2d'),t=0,P=Array.from({length:90},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,v:2+Math.random()*4,r:4+Math.random()*5,c:`hsl(${Math.random()*360},90%,60%)`,s:Math.random()*6}));(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.s+=.05)*2;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.6)});if(++t<240)requestAnimationFrame(f);else c.remove()})()}

const city=(()=>{let x=0,o='';[40,62,30,75,48,58,35,70,44,66,38,52,30,60].forEach((h,i)=>{o+=`<rect x="${x}" y="${90-h}" width="28" height="${h}" fill="#03040a"/>`;if(i%2==0)o+=`<rect class="win" style="animation-delay:${i*.4}s" x="${x+8}" y="${90-h+10}" width="5" height="6"/>`;x+=28});return `<svg class="city" viewBox="0 0 392 90" preserveAspectRatio="none">${o}</svg>`})();
/* ===== Pilih kelas & nama dari database siswa (siswa.json di portal) ===== */
let DB_SISWA=null;
function muatSiswa(){
 if(DB_SISWA)return Promise.resolve(DB_SISWA);
 return fetch('../siswa.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()})
  .then(d=>{if(!d.siswa||!d.siswa.length)throw 0;return d.siswa})
  .catch(()=>{try{let d=JSON.parse(localStorage.getItem('siswa_db'));return(d&&d.siswa)||[]}catch(e){return[]}})
  .then(a=>DB_SISWA=a)}
function pasangPilihan(){
 muatSiswa().then(D=>{
  let nm=$('#nm'),kl=$('#kl');if(!D.length||!nm||!kl)return; /* tanpa data: tetap isian manual */
  let box=nm.parentNode,sk=document.createElement('select'),sn=document.createElement('select'),lb=t=>{let l=document.createElement('label');l.textContent=t;return l};
  sk.id='kl';sn.id='nm';
  const KLS=[...new Set(D.map(s=>s.kelas))].sort((a,b)=>a.localeCompare(b,'id',{numeric:true}));
  const isi=(sel,ph,arr)=>{sel.replaceChildren(new Option(ph,''));arr.forEach(v=>sel.append(new Option(v,v)))};
  const namaDi=k=>D.filter(s=>s.kelas===k).map(s=>s.nama).sort((a,b)=>a.localeCompare(b,'id'));
  isi(sk,'— pilih kelas —',KLS);isi(sn,'— pilih nama —',[]);sn.disabled=true;
  sk.onchange=()=>{isi(sn,'— pilih nama —',namaDi(sk.value));sn.disabled=!sk.value};
  sn.onchange=()=>{try{localStorage.setItem('siswa_dipilih',JSON.stringify({nama:sn.value,kelas:sk.value}))}catch(e){}};
  box.replaceChildren(lb('KELAS'),sk,Object.assign(lb('NAMA'),{style:'display:block;margin-top:10px'}),sn);
  let p=S.nama&&S.kelas?{nama:S.nama,kelas:S.kelas}:null;
  if(!p){try{p=JSON.parse(localStorage.getItem('siswa_dipilih'))}catch(e){}}
  if(p&&KLS.includes(p.kelas)){sk.value=p.kelas;sk.onchange();if(namaDi(p.kelas).includes(p.nama))sn.value=p.nama}
 })}

/* ===== Seret & lepas (pointer events, aman untuk sentuhan) ===== */
function dnd(root,onDrop){
 let g=null,sel=null;
 root.querySelectorAll('.chip').forEach(c=>{
  c.onpointerdown=e=>{if(c.classList.contains('used'))return;e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(x){}
   if(sel)sel.classList.remove('sel');sel=c;c.classList.add('sel');c.mv=0;c.sx=e.clientX;c.sy=e.clientY;
   g=c.cloneNode(true);g.className='chip ghost';g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';g.style.display='none';document.body.appendChild(g)};
  c.onpointermove=e=>{if(!g)return;if(Math.abs(e.clientX-c.sx)+Math.abs(e.clientY-c.sy)>8)c.mv=1;if(c.mv){g.style.display='flex';g.style.left=e.clientX+'px';g.style.top=e.clientY+'px'}};
  c.onpointerup=e=>{if(!g)return;g.remove();g=null;if(c.mv){let el=document.elementFromPoint(e.clientX,e.clientY),s=el&&el.closest('.slot');if(s)onDrop(c,s)}};
  c.onpointercancel=()=>{if(g){g.remove();g=null}}});
 root.querySelectorAll('.slot').forEach(s=>s.onclick=()=>{if(sel&&!sel.classList.contains('used'))onDrop(sel,s)})}

  let jb=$('#jb'),tr=$('#tr'),bw=jb.clientWidth,bh=jb.clientHeight,pw=bw/c,ph=bh/r;
  jb.innerHTML=[...Array(n).keys()].map(k=>`<div class="sl" style="left:${(k%c)*pw}px;top:${(k/c|0)*ph}px;width:${pw}px;height:${ph}px"></div>`).join('');
  tr.innerHTML=acak([...Array(n).keys()]).map(v=>`<div class="pp" data-v="${v}" style="width:${pw}px;height:${ph}px;background-size:${bw}px ${bh}px;background-position:${-(v%c)*pw}px ${-(v/c|0)*ph}px"></div>`).join('');
  const menang=()=>{fin=1;jb.classList.add('done');sfx.win();tambah(20);lompat();say('Foto utuh! Lihat apa yang terungkap. 🔎');
   $('.scr').insertAdjacentHTML('beforeend',`<div class="card fb benar">🔎 <b>${p.tx}</b><br>${p.cap}</div>`);
   lanjut(()=>mc([p.q],()=>{i++;t()},{ikon:'🔎'}))};
  const coba=(el,x,y)=>{let v=+el.dataset.v,cx=(v%c+.5)*pw,cy=((v/c|0)+.5)*ph;

const PERINGKAT_URL=""; // TEMPEL URL Web App Apps Script di antara tanda kutip. Kosong = peringkat hanya di perangkat ini.
function antre(){try{return JSON.parse(localStorage.getItem('dd_q'))||[]}catch(e){return[]}}
function simAntre(a){try{localStorage.setItem('dd_q',JSON.stringify(a))}catch(e){}}
/* Kirim skor siswa yang tamat; bila offline, simpan di antrean dan kirim ulang saat online */
function kirim(d){if(!PERINGKAT_URL)return;fetch(PERINGKAT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(d)}).catch(()=>{let a=antre();a.push(d);simAntre(a)})}
function kirimAntrean(){let a=antre();if(!a.length||!PERINGKAT_URL||!navigator.onLine)return;simAntre([]);a.forEach(kirim)}
function peringkat(){
 tampil(hud()+hoot('Inilah para detektif terbaik Santunlandia! 🏆')+`<div class="card"><h3>🌐 Peringkat Semua Siswa</h3><div id="pr">⏳ Memuat…</div></div><button class="btn g" onclick="${S.nama?'peta()':'awal()'}">⬅️ Kembali</button>`);
 const tulis=(L,ket)=>{$('#pr').innerHTML=(ket||'')+(L.length?`<ol style="padding-left:22px">${L.map((p,i)=>`<li${p.nama==S.nama?' style="color:var(--g);font-weight:800"':''}>${['🥇','🥈','🥉'][i]||''} ${esc(p.nama)}${p.kelas?' ('+esc(p.kelas)+')':''} — ${p.skor} poin</li>`).join('')}</ol>`:'<p>Belum ada data.</p>')};
 const lokal=()=>papan().map(p=>({nama:p.n,skor:p.s}));
 if(!PERINGKAT_URL)return tulis(lokal(),'<p class="kecil">Mode offline: peringkat di perangkat ini saja.</p>');
 fetch(PERINGKAT_URL).then(r=>r.json()).then(d=>tulis(d.slice(0,30))).catch(()=>tulis(lokal(),'<p class="kecil">Tidak dapat terhubung ke internet. Menampilkan peringkat di perangkat ini.</p>'))}

/* Buka aplikasi WhatsApp langsung (skema whatsapp://), cadangan ke api.whatsapp.com bila tidak terbuka */
function bukaWA(){let n=NOMOR_WA_INSPEKTUR.replace(/\D/g,'');if(n[0]=='0')n='62'+n.slice(1);
 let q=(n?'phone='+n+'&':'')+'text='+encodeURIComponent(pesanWA()),t0=Date.now();
 location.href='whatsapp://send?'+q;
 setTimeout(()=>{if(!document.hidden&&Date.now()-t0<4000){let w=window.open('https://api.whatsapp.com/send?'+q,'_blank');if(!w)location.href='https://api.whatsapp.com/send?'+q}},1500)}

 for(let i=0;i<40;i++){x.fillStyle='rgba(245,197,66,.25)';x.beginPath();x.arc((i*131)%720,(i*257)%960,2+i%3,0,7);x.fill()}
 x.strokeStyle='#f5c542';x.lineWidth=6;x.strokeRect(20,20,680,920);x.lineWidth=2;x.strokeRect(36,36,648,888);

 tx('Skor: '+S.skor+'  •  XP: '+S.xp,595,32,'#fff',1);tx('Bintang: '+d.tot+'/15 '+'⭐'.repeat(Math.round(d.tot/5)),645,32,'#fff');
 tx(d.tg+(S.kelas?'  •  Kelas '+S.kelas:''),695,28,'#fff');
 x.font='bold 26px Nunito,Arial,sans-serif';x.fillStyle='#2ee6d6';
