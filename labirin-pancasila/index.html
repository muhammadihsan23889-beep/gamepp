function bfs(l,ti,tj){const d=Array.from({length:HH},()=>Array(W).fill(99));d[tj][ti]=0;const q=[[ti,tj]];while(q.length){const [x,y]=q.shift();for(const [dx,dy] of D4){const a=x+dx,b=y+dy;if(!solidL(l,a,b)&&d[b][a]>d[y][x]+1){d[b][a]=d[y][x]+1;q.push([a,b])}}}return d}
const cl=v=>Math.max(0,Math.min(W-1,Math.round(v/C))),cl2=v=>Math.max(0,Math.min(HH-1,Math.round(v/C)));
function spawnMonster(){monL=P.lv;const d=bfs(monL,cl(P.position.x),cl2(P.position.z)),c=[];for(let j=0;j<HH;j++)for(let i=0;i<W;i++)if(!solidL(monL,i,j)&&d[j][i]>=3&&d[j][i]<=5)c.push([i,j]);const s=c[Math.floor(Math.random()*c.length)]||[1,1];SH.position.set(s[0]*C,BASE[monL]+2.3,s[1]*C);SH.visible=true;mon=1;mT=5;sfx(0);buzz(true);if(MUS)MUS.hit();toast('🚁 DRONE PEMBURU MUNCUL!',2)}
